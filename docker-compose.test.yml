# Test/dev only: reach PostgreSQL from the host so `pytest` can run.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres migrate
# Internal networks cannot publish ports, so postgres also joins `edge` here.
# Never use this override on a machine that holds real data.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [data, edge]
