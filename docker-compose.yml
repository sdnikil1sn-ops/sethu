# SETHU: full stack, one command.  docker compose up --build
#
# Network zones (see docs/ARCHITECTURE.md):
#   edge  - the only network with a published port
#   app   - internal: API, worker, identity, mail
#   data  - internal: PostgreSQL, Redis
#   ai    - internal: the ai-worker (and, later, local model servers); no route out, no published port
# `internal: true` means containers on that network have no route to the
# internet. Complaint data cannot leave the deployment at run time.

name: sethu

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-backend-env: &backend-env
  SETHU_ENVIRONMENT: ${SETHU_ENVIRONMENT:-dev}
  SETHU_DATABASE_URL: postgresql+psycopg://sethu_app:${SETHU_APP_PASSWORD}@postgres:5432/sethu
  SETHU_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SETHU_OIDC_ISSUER: ${PUBLIC_BASE_URL:-http://localhost:8080}/auth/realms/sethu
  SETHU_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/sethu/protocol/openid-connect/certs
  SETHU_OIDC_AUDIENCE: sethu-api
  SETHU_SMTP_HOST: ${SMTP_HOST:-mailpit}
  SETHU_SMTP_PORT: ${SMTP_PORT:-1025}
  SETHU_SMTP_SECURITY: ${SMTP_SECURITY:-none}       # Mailpit is plain; production requires starttls or tls
  SETHU_SMTP_USERNAME: ${SMTP_USERNAME:-}
  SETHU_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SETHU_SMTP_CA_FILE: ${SMTP_CA_FILE:-}
  SETHU_DEBUG: ${SETHU_DEBUG:-false}
  SETHU_COMPLAINANT_KEYS_FILE: /run/secrets/complainant_keys
  SETHU_INTAKE_SPOOL_DIR: /spool   # mounted into the worker only (the fallback intake channel)
  SETHU_KEYCLOAK_EVENTS_SECRET: ${KEYCLOAK_EVENTS_SECRET:-}   # sign-in events on the Audit log screen
  SETHU_AUDIT_ANCHOR_DIR: /anchor   # write-once anchors: the worker appends, the backend reads
  # Findings thresholds (docs/RUNBOOK.md). The defaults repeat backend/app/core/config.py: keep them equal.
  SETHU_STALLED_TRANSFER_DAYS: ${SETHU_STALLED_TRANSFER_DAYS:-7}
  SETHU_BOTTLENECK_MIN_OPEN: ${SETHU_BOTTLENECK_MIN_OPEN:-3}
  SETHU_BOTTLENECK_SHARE: ${SETHU_BOTTLENECK_SHARE:-0.6}
  SETHU_SPIKE_MIN_COUNT: ${SETHU_SPIKE_MIN_COUNT:-5}
  SETHU_SPIKE_RATIO: ${SETHU_SPIKE_RATIO:-3.0}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]   # needed by the image entrypoint
    environment:
      POSTGRES_DB: sethu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
      SETHU_OWNER_PASSWORD: ${SETHU_OWNER_PASSWORD}
      SETHU_APP_PASSWORD: ${SETHU_APP_PASSWORD}
      SETHU_AUDITOR_PASSWORD: ${SETHU_AUDITOR_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sethu"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    <<: *hardening
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]            # needed by the image entrypoint
    read_only: true
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    deploy: { resources: { limits: { memory: 384m } } }

  migrate:
    <<: *hardening
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    read_only: true
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://sethu_owner:${SETHU_OWNER_PASSWORD}@postgres:5432/sethu
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    deploy: { resources: { limits: { memory: 256m } } }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    command: ["start-dev", "--import-realm"]          # replaced by `start` in docker-compose.prod.yml
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_BASE_URL:-http://localhost:8080}/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-sethu-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_EVENTS_SECRET: ${KEYCLOAK_EVENTS_SECRET:?run python scripts/init_env.py (adds KEYCLOAK_EVENTS_SECRET)}   # read by the realm file
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:                      # the image has no curl: ask the management port with bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app, data]
    deploy: { resources: { limits: { memory: 1g } } }

  demo-users:                         # dev and demo only: creates the demo logins, then exits
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    profiles: ["dev"]
    restart: "no"
    entrypoint: ["/bin/bash", "/demo/import.sh"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SETHU_ENVIRONMENT: ${SETHU_ENVIRONMENT:-dev}      # import.sh refuses prod
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-sethu-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    volumes:
      - ./infra/demo-users:/demo:ro
    depends_on:
      keycloak: { condition: service_started }
    networks: [app]
    deploy: { resources: { limits: { memory: 384m } } }

  backend:
    <<: *hardening
    build: ./backend
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ${SETHU_AUDIT_ANCHOR_DIR:-./anchor}:/anchor:ro    # compared on the Audit log screen
    environment: *backend-env
    secrets: [complainant_keys]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app, data]
    deploy: { resources: { limits: { memory: 768m } } }

  worker:
    <<: *hardening
    build: ./backend
    command: ["celery", "-A", "app.worker:celery", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:   # spool folder: <source name>/*.csv|*.xlsx; files are moved to processed/ or rejected/
      - ${SETHU_INTAKE_SPOOL_DIR:-./spool}:/spool
      - ${SETHU_AUDIT_ANCHOR_DIR:-./anchor}:/anchor        # make it append-only on the host (docs/OPERATIONS.md)
    healthcheck:                      # the worker answers a ping through Redis
      test: ["CMD-SHELL", "celery -A app.worker:celery inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    environment: *backend-env
    secrets: [complainant_keys]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app, data]
    deploy: { resources: { limits: { memory: 768m } } }

  # Celery beat: puts the scheduled jobs on the queue; the worker runs them. Its own service so the
  # worker can be scaled without firing every job once per worker. It holds a Redis lock while it
  # runs (SingleScheduler in app/worker.py): a second copy refuses to start.
  scheduler:
    <<: *hardening
    build: ./backend
    command: ["celery", "-A", "app.worker:celery", "beat", "--scheduler", "app.worker:SingleScheduler",
              "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:   # beat saves its schedule file every few minutes while it runs
      test: ["CMD-SHELL", "find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -10 | grep -q ."]
      interval: 60s
      timeout: 10s
      start_period: 60s
    environment: *backend-env
    secrets: [complainant_keys]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data]
    deploy: { resources: { limits: { memory: 256m } } }

  # The AI layer (docs/AI-PIPELINE.md): its own Celery queue, one process, models from a read-only folder.
  # On the `ai` zone and `data` (for Redis and PostgreSQL) only: no route to the internet, no published port.
  ai-worker:
    <<: *hardening
    build: { context: ./backend, target: ai }     # the runtime plus the AI engines (backend/Dockerfile)
    command: ["celery", "-A", "app.ai.tasks:celery", "worker", "-Q", "ai", "--pool", "solo",
              "-n", "ai@%h", "--loglevel", "INFO"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ${SETHU_MODELS_DIR:-./models}:/models:ro          # models/manifest.json and the files it checks
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.ai.tasks:celery inspect ping -d ai@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    environment:
      <<: *backend-env
      SETHU_AI_MODELS_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    secrets: [complainant_keys]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [ai, data]
    deploy: { resources: { limits: { memory: "${SETHU_AI_WORKER_MEMORY:-3g}" } } }

  web:
    <<: *hardening
    build: ./web
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./infra/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:8080:8080"        # bound to this machine only
    depends_on:
      backend: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [edge, app]
    deploy: { resources: { limits: { memory: 128m } } }

  mailpit:                            # local mail catcher for the demo; not in production
    <<: *hardening
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge, app]

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }
  ai: { internal: true }

# Secret files, mounted read-only under /run/secrets. Never in the image or an environment value.
# Created per machine: scripts/init_env.py (dev) or docs/RUNBOOK.md section 7 (production).
secrets:
  complainant_keys:
    file: ${SETHU_SECRETS_DIR:-./secrets}/complainant_keys.json

volumes:
  pgdata: {}
  redisdata: {}
