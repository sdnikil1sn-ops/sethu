# Production overrides (docs/RUNBOOK.md section 7).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Never add `--profile dev`: there is no Mailpit and no demo users here, and both refuse
# production anyway.
#
# Requires in .env: SETHU_ENVIRONMENT=prod, PUBLIC_BASE_URL=https://<host>, SMTP_HOST,
# SMTP_PORT, ALERT_FROM, and certificates in infra/certs/server.crt and server.key.
# The backend and worker refuse to start on a missing, placeholder or dev value
# (app/core/config.py). Only the edge is published: 443, and 9443 on the host's own
# loopback for Keycloak administration through an SSH tunnel.

x-prod-backend-env: &prod-backend-env
  SETHU_ENVIRONMENT: prod
  SETHU_DEBUG: "false"
  SETHU_OIDC_ISSUER: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to https://<host>}/auth/realms/sethu
  SETHU_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST to the mail relay}
  SETHU_SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
  SETHU_ALERT_FROM: ${ALERT_FROM:?set ALERT_FROM to the sender address}

services:
  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}/auth
      KC_HOSTNAME_ADMIN: https://localhost:9443/auth   # the admin console, through the tunnel only
      SETHU_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}   # read by the realm file
    volumes: !override
      - ./infra/keycloak-prod:/opt/keycloak/data/import:ro

  backend:
    environment: *prod-backend-env

  worker:
    environment: *prod-backend-env

  migrate:
    restart: "no"

  web:
    volumes: !override
      - ./infra/web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    ports: !override
      - "443:8443"
      - "127.0.0.1:9443:9443"
    depends_on:
      backend: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # Dev and demo only. Disabled here even if someone adds `--profile dev`.
  demo-users:
    profiles: !override ["never-in-production"]
    environment:
      SETHU_ENVIRONMENT: prod

  mailpit:
    profiles: !override ["never-in-production"]
    ports: !reset []
