# Edge: serves the web app and proxies /api and /auth. Development (HTTP).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://backend:8000;
        access_log off;
    }

    location /auth/ {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://keycloak:8080;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / {
        try_files $uri /index.html;
    }
}
