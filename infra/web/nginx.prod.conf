# Edge: production (TLS 1.3 only). Certificates are mounted from infra/certs.
#   8443  public: the web app, /api and the sign-in pages of the sethu realm. The Keycloak admin
#         console and the master realm are refused here.
#   9443  administrators only: Keycloak (admin console included). docker-compose.prod.yml binds it
#         to 127.0.0.1 on the host, so it is reached through an SSH tunnel (docs/RUNBOOK.md section 7).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/s;   # the admin console fires bursts of calls
limit_req_status 429;

# Upstreams by name, looked up again every 10 s through Docker's DNS: recreating the backend or Keycloak
# (a new address) needs no restart of this container. A variable in proxy_pass makes nginx resolve at request
# time; without a URI part, the request path is passed on unchanged.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
map $host $sethu_backend { default http://backend:8000; }
map $host $sethu_keycloak { default http://keycloak:8080; }

# Access log: JSON, the path without its query string (search terms can name people), and the request id
# that is also passed to the backend (X-Request-ID), so one id ties the edge and app lines together.
log_format sethu escape=json '{"ts":"$time_iso8601","logger":"edge","remote":"$remote_addr","method":"$request_method",'
                             '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
                             '"request_id":"$request_id"}';
access_log /dev/stdout sethu;

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# Container health check only (docker-compose healthcheck); not published.
server {
    listen 127.0.0.1:8090;
    location = /nginx-health { access_log off; return 200 "ok"; }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-ID $request_id;   # the same id in the edge and app logs

    location = /metrics { return 404; }   # internal only: scraped on the backend's own port

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $sethu_backend;
        proxy_read_timeout 60s;
    }

    location = /sign-in-unavailable.html { internal; }
    location /health/ { return 404; }   # health is for the containers, not the internet

    # Administration stays off the public edge: use port 9443 through an SSH tunnel.
    location ^~ /auth/admin/ { return 404; }
    location ^~ /auth/realms/master/ { return 404; }

    # Keycloak's static files: no rate limit (the sign-in pages load dozens at once).
    location ^~ /auth/resources/ {
        proxy_pass $sethu_keycloak;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Sign-in pages and token requests: the strict limit.
    location /auth/ {
        limit_req zone=login burst=20 nodelay;
        proxy_pass $sethu_keycloak;
        error_page 502 503 504 /sign-in-unavailable.html;   # Keycloak down: say so plainly
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        # Keycloak sends its own CSP, X-Frame-Options, nosniff, Referrer-Policy and HSTS for its pages;
        # the app's stricter CSP would break them. An add_header here stops the server-level ones for /auth.
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 9443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-ID $request_id;   # the same id in the edge and app logs

    location /auth/ {
        limit_req zone=admin burst=200 nodelay;
        proxy_pass $sethu_keycloak;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / { return 404; }
}
