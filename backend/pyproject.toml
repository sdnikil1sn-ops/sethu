[project]
name = "sethu-backend"
version = "0.1.0"
description = "SETHU: AICTE cross-bureau complaint monitoring (SIH26264)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",  # model query params (Annotated[Filters, Query()]) fail on 0.115.x
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pyjwt[crypto]>=2.9,<3",
    "celery[redis]>=5.4,<6",
    "openpyxl>=3.1,<4",  # reading XLSX intake files; no network use
    "fastembed==0.9.1",  # semantic overlap signal; runs a local ONNX model baked into the image
    "pillow>=13.0",      # via fastembed; older Pillow has known vulnerabilities (pip-audit)
    "networkx==3.7",     # A4 relationship graph (Louvain, betweenness); pure Python, 19 MB installed
    "onnxruntime==1.19.2",  # via fastembed; later builds bundle a telemetry client (it could not send: no route out)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
"app.ai" = ["data/*.jsonl"]   # the category classifier's bootstrap set (scripts/make_category_bootstrap.py)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_models: needs the real AI models and libraries (tests/test_ai_models.py); skipped otherwise"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/ai/vendor"]   # third-party code kept as upstream wrote it (see its README)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]  # B008: FastAPI Depends() defaults are idiomatic
